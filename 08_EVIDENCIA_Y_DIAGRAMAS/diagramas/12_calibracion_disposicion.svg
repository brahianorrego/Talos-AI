<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" font-family="Times New Roman, serif">
<rect width="1000" height="1250" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="24" font-weight="700">Medición de ángulos: disposición de la prueba</text>
<text x="500" y="58" text-anchor="middle" font-size="15" fill="#444">Dron sobre el escritorio de la habitación (75.5 cm), mirando una pared lisa a unos 2 m. Cotas en cm desde el piso.</text>
<text x="40" y="96" font-size="18" font-weight="700">A · Vista lateral</text>
<line x1="40" y1="560" x2="960" y2="560" stroke="#555" stroke-width="2"/><text x="960" y="576" text-anchor="end" font-size="12" fill="#555">piso</text>
<rect x="70" y="409" width="190" height="151" fill="#d7ccc8" stroke="#6d4c41" stroke-width="2"/>
<text x="165" y="469" text-anchor="middle" font-size="14" fill="#4e342e">Escritorio</text><text x="165" y="487" text-anchor="middle" font-size="14" font-weight="700" fill="#4e342e">75.5 cm</text>
<rect x="550" y="60" width="10" height="500" fill="#fafafa" stroke="#555" stroke-width="2"/>
<text x="566" y="72" font-size="13" fill="#555">pared lisa</text>
<rect x="120" y="332" width="30" height="24" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<rect x="136" y="349" width="14" height="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
<text x="135" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">dron</text>
<line x1="150" y1="342" x2="550" y2="377" stroke="#e65100" stroke-width="1.5" stroke-dasharray="7 4"/>
<line x1="150" y1="353" x2="550" y2="388" stroke="#c2185b" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="170" y="312" font-size="12" fill="#bf360c">eje de la cámara: 109 cm (inclinación nominal −5°)</text>
<text x="170" y="389" font-size="12" fill="#880e4f">eje del LiDAR: 103.5 cm</text>
<line x1="150" y1="342" x2="550" y2="201" stroke="#e65100" stroke-width="1" opacity="0.55"/>
<line x1="150" y1="342" x2="537" y2="560" stroke="#e65100" stroke-width="1" opacity="0.55"/>
<text x="320" y="222" font-size="12" fill="#bf360c" opacity="0.9">campo vertical (nominal 48.8°)</text>
<rect x="538" y="472" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="572" y="485" font-size="13" font-weight="700" fill="#e65100">B · 40 cm</text>
<rect x="538" y="252" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="572" y="265" font-size="13" font-weight="700" fill="#e65100">T · 150 cm</text>
<rect x="538" y="372" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="572" y="385" font-size="13" font-weight="700" fill="#e65100">L y R · 90 cm</text>
<line x1="150" y1="594" x2="550" y2="594" stroke="#000" stroke-width="1.5"/><line x1="150" y1="588" x2="150" y2="600" stroke="#000"/><line x1="550" y1="588" x2="550" y2="600" stroke="#000"/>
<text x="350" y="616" text-anchor="middle" font-size="14" font-weight="700">D ≈ 2 m (la lee el LiDAR; verifícala con el metro)</text>
<circle cx="350" cy="370" r="7" fill="#ff80ab" stroke="#c2185b" stroke-width="2"/>
<text x="350" y="394" text-anchor="middle" font-size="12" fill="#880e4f">dedo a 1 m</text>
<circle cx="450" cy="379" r="7" fill="#ff80ab" stroke="#c2185b" stroke-width="2"/>
<text x="450" y="403" text-anchor="middle" font-size="12" fill="#880e4f">dedo a 1.5 m</text>
<line x1="40" y1="409" x2="40" y2="560" stroke="#000"/><text x="34" y="484" text-anchor="end" font-size="12">75.5</text>
<text x="40" y="720" font-size="18" font-weight="700">B · La pared vista de frente (como la ve la cámara)</text>
<rect x="340" y="746" width="320" height="384" fill="#fafafa" stroke="#555" stroke-width="2"/>
<line x1="500" y1="746" x2="500" y2="1130" stroke="#777" stroke-dasharray="6 5"/>
<text x="500" y="738" text-anchor="middle" font-size="12" fill="#555">línea central (el dron mira aquí)</text>
<rect x="396" y="978" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="418" y="991" font-size="14" font-weight="700" fill="#e65100">L · 90 cm</text>
<rect x="588" y="978" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="610" y="991" font-size="14" font-weight="700" fill="#e65100">R · 90 cm</text>
<rect x="492" y="1058" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="514" y="1071" font-size="14" font-weight="700" fill="#e65100">B · 40 cm</text>
<rect x="492" y="882" width="16" height="16" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
<text x="514" y="895" font-size="14" font-weight="700" fill="#e65100">T · 150 cm</text>
<line x1="404" y1="948" x2="596" y2="948" stroke="#000" stroke-width="1.5"/>
<line x1="404" y1="942" x2="404" y2="954" stroke="#000"/><line x1="596" y1="942" x2="596" y2="954" stroke="#000"/>
<line x1="404" y1="948" x2="404" y2="978" stroke="#999" stroke-dasharray="3 3"/><line x1="596" y1="948" x2="596" y2="978" stroke="#999" stroke-dasharray="3 3"/>
<text x="500" y="940" text-anchor="middle" font-size="14" font-weight="700">120 cm entre L y R</text>
<line x1="300" y1="1066" x2="300" y2="890" stroke="#000" stroke-width="1.5"/>
<line x1="294" y1="1066" x2="306" y2="1066" stroke="#000"/><line x1="294" y1="890" x2="306" y2="890" stroke="#000"/>
<text x="292" y="970" text-anchor="end" font-size="14" font-weight="700">110 cm entre B y T</text>
<text x="292" y="986" text-anchor="end" font-size="12" fill="#555">(alturas medidas desde el piso)</text>
<line x1="308" y1="1130" x2="692" y2="1130" stroke="#9e9e9e" stroke-width="3"/><text x="692" y="1146" text-anchor="end" font-size="12" fill="#757575">piso</text>
<rect x="40" y="1160" width="920" height="80" rx="8" fill="#f5f5f5" stroke="#cfd8dc"/>
<text x="56" y="1182" font-size="13" fill="#333">• Marcas: cuadrados de papel de color de unos 10 × 10 cm (o cinta). Se hace clic en el centro de cada uno.</text>
<text x="56" y="1202" font-size="13" fill="#333">• Todas las alturas se miden con el metro desde el piso, no desde el escritorio. Si se pega a otra altura, se escribe esa en la página.</text>
<text x="56" y="1222" font-size="13" fill="#333">• El dron debe quedar mirando de frente a la pared: la distancia de su lado izquierdo y de su lado derecho a la pared debe ser igual.</text>
</svg>